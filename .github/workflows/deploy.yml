name: Test and deploy Recepeit Vault

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enrich_artwork:
        description: Enrich missing TV artwork using the TMDB secret
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Optional manual TV artwork enrichment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enrich_artwork }}
        run: node scripts/enrich-catalog.mjs
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      - run: npm test
      - name: Build for the repository Pages URL
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
